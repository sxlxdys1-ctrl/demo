name: Publish mobile game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published game
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 15 "$PAGE_URL" -o /tmp/game-page.html && grep -q '超级好玩的小世界' /tmp/game-page.html; then
              break
            fi
            sleep 5
          done
          grep -q '超级好玩的小世界' /tmp/game-page.html
          script=$(grep -oE 'src="\./assets/[^\"]+\.js"' /tmp/game-page.html | head -1 | cut -d '"' -f 2)
          test -n "$script"
          curl -fsSL --max-time 15 -o /dev/null "${PAGE_URL%/}/${script#./}"
