name: Check mobile game publication

on:
  push:
    branches: [main]
    paths: [.github/workflows/pages-diagnostic.yml]

permissions:
  contents: write
  pages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages and save the result in a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          page_status=$(curl -sS -o /tmp/page.json -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")
          create_status=skipped
          if [ "$page_status" != 200 ]; then
            create_status=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d '{"build_type":"workflow"}' "$api")
          fi
          sleep 5
          final_status=$(curl -sS -o /tmp/final.json -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")
          website_status=$(curl -sS -L -o /tmp/website.html -w '%{http_code}' "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/")
          {
            echo "Initial Pages API: $page_status"
            echo "Create Pages API: $create_status"
            echo "Final Pages API: $final_status"
            echo "Website HTTP: $website_status"
            echo "Initial message: $(jq -r '.message // empty' /tmp/page.json)"
            if [ -f /tmp/create.json ]; then echo "Create message: $(jq -r '.message // empty' /tmp/create.json)"; fi
            echo "Final message: $(jq -r '.message // empty' /tmp/final.json)"
          } > /tmp/pages-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan codex-pages-diagnostic
          git rm -rf .
          cp /tmp/pages-result.txt pages-result.txt
          git add pages-result.txt
          git commit -m 'Record Pages publication status'
          git push -f origin HEAD:refs/heads/codex-pages-diagnostic
